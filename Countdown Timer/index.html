<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>

    <!-- styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="section-center"> 
        <article>
            <img src="gift.jpeg" alt="gift picture"/>
        </article>
        <article class="gift-info">
            <h3> Old Iphone Giveaway </h3>
            <h4 class="giveaway"> 
            Giveaway Ends On 
            <span class="end-day">Sunday</span>, 
            <span class="end-date">3</span> 
            <span class="end-month">May</span> 
            <span class="end-year">2020</span> 
            <span class="end-time">11:30</span>.
            </h4>
            <p> says a bunch of things </p>
            <div class="deadline">
                <div class="deadline-format">
                    <div>
                        <h4 class="days"> 999 </h4>
                        <span> DAYS </span> 
                    </div>
                </div>
                <div class="deadline-format">
                    <div>
                        <h4 class="hours"> 99 </h4>
                        <span> HOURS </span> 
                    </div>
                </div>
                <div class="deadline-format">
                    <div>
                        <h4 class="mins"> 99 </h4>
                        <span> MINS </span> 
                    </div>
                </div>
                <div class="deadline-format">
                    <div>
                        <h4 class="secs"> 99 </h4>
                        <span> SECS </span> 
                    </div>
                </div>
            </div>
        </article>
    </section>
    
    <!-- javascript -->
    <script src="app.js"></script>
  </body>
</html>
